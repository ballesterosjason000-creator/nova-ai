<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI — Chat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b0b10;
            --sidebar: #111118;
            --card: #171720;
            --card-hover: #1d1d28;
            --border: #292936;
            --text: #f5f5f7;
            --muted: #9696a5;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --user: #262333;
            --danger: #ef4444;
        }

        body.light {
            --bg: #f6f6f8;
            --sidebar: #ffffff;
            --card: #ffffff;
            --card-hover: #f0f0f4;
            --border: #dedee6;
            --text: #17171c;
            --muted: #686875;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --user: #ece8ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        button,
        textarea {
            font-family: inherit;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 260px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 18px;
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 22px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #8b5cf6, #4f46e5);
            color: white;
            font-size: 18px;
        }

        .new-chat {
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .new-chat:hover {
            background: var(--card-hover);
        }

        .section-title {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 25px 4px 10px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            font-size: 13px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item:hover {
            background: var(--card-hover);
            color: var(--text);
        }

        .sidebar-bottom {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .side-button {
            border: none;
            background: transparent;
            color: var(--muted);
            padding: 10px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
        }

        .side-button:hover {
            background: var(--card-hover);
            color: var(--text);
        }

        /* MAIN */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 64px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
        }

        .model-status {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 14px;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #22c55e;
        }

        .home-button {
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            padding: 8px 13px;
            border-radius: 8px;
            cursor: pointer;
        }

        .home-button:hover {
            background: var(--card-hover);
        }

        /* CHAT */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 35px 20px;
        }

        .welcome {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .welcome-inner {
            max-width: 650px;
        }

        .welcome-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: linear-gradient(135deg, #8b5cf6, #4f46e5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 30px;
        }

        .welcome h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: var(--muted);
            line-height: 1.6;
        }

        .message {
            max-width: 850px;
            margin: 0 auto 25px;
            display: flex;
            gap: 14px;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 13px;
            font-weight: 700;
        }

        .message.user .avatar {
            background: var(--user);
        }

        .message.assistant .avatar {
            background: linear-gradient(135deg, #8b5cf6, #4f46e5);
            color: white;
        }

        .message-content {
            flex: 1;
            min-width: 0;
            line-height: 1.65;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-role {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        /* INPUT */

        .input-area {
            padding: 15px 20px 22px;
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 15px;
            display: flex;
            align-items: flex-end;
            padding: 10px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            color: var(--text);
            padding: 8px;
            max-height: 180px;
            min-height: 42px;
            font-size: 15px;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: var(--muted);
        }

        .send-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 11px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-size: 18px;
        }

        .send-button:hover {
            background: var(--accent-hover);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-5px);
            }
        }

        @media (max-width: 750px) {
            .sidebar {
                display: none;
            }

            .welcome h1 {
                font-size: 28px;
            }

            .messages {
                padding: 25px 14px;
            }

            .input-area {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">✦</div>
            Nova AI
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New conversation
        </button>

        <div class="section-title">
            Recent chats
        </div>

        <div class="chat-list" id="chatList"></div>

        <div class="sidebar-bottom">

            <button class="side-button" onclick="clearChats()">
                🗑 Clear chats
            </button>

            <button class="side-button" onclick="toggleTheme()">
                ◐ Theme
            </button>

            <button class="side-button" onclick="openSettings()">
                ⚙ Settings
            </button>

        </div>

    </aside>

    <main class="main">

        <header class="topbar">

            <div class="model-status">
                <span class="status-dot"></span>
                <span id="modelName">Nova AI</span>
            </div>

            <button class="home-button" onclick="location.href='/'">
                Home
            </button>

        </header>

        <section class="messages" id="messages">

            <div class="welcome" id="welcome">

                <div class="welcome-inner">

                    <div class="welcome-icon">
                        ✦
                    </div>

                    <h1>How can I help?</h1>

                    <p>
                        I'm Nova AI, your personal AI assistant.
                        Ask me anything, work on code, learn something,
                        or just start a conversation.
                    </p>

                </div>

            </div>

        </section>

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Message Nova..."
                    rows="1"
                ></textarea>

                <button
                    class="send-button"
                    id="sendButton"
                    onclick="sendMessage()"
                >
                    ↑
                </button>

            </div>

        </div>

    </main>

</div>

<script>
    // ============================================================
    // NOVA AI PUBLIC BACKEND
    // ============================================================

    const API_BASE =
        "https://labored-overlap-reappoint.ngrok-free.dev";

    const CHAT_ENDPOINT =
        `${API_BASE}/api/chat`;

    const MODELS_ENDPOINT =
        `${API_BASE}/api/models`;


    // ============================================================
    // STATE
    // ============================================================

    let messages = [];

    let chats =
        JSON.parse(
            localStorage.getItem("nova_chats") || "[]"
        );

    let settings =
        JSON.parse(
            localStorage.getItem("nova_settings") || "{}"
        );


    // ============================================================
    // DEFAULT SETTINGS
    // ============================================================

    settings = {
        model: settings.model || "llama3.2:3b",
        temperature:
            typeof settings.temperature === "number"
                ? settings.temperature
                : 0.7,
        length:
            settings.length || "medium",
        personality:
            settings.personality ||
            "Be friendly, helpful, smart, direct, and easy to understand.",
        memory:
            settings.memory !== false,
        casual:
            settings.casual !== false
    };


    // ============================================================
    // ELEMENTS
    // ============================================================

    const messagesElement =
        document.getElementById("messages");

    const welcomeElement =
        document.getElementById("welcome");

    const input =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const chatList =
        document.getElementById("chatList");

    const modelName =
        document.getElementById("modelName");


    // ============================================================
    // THEME
    // ============================================================

    const savedTheme =
        localStorage.getItem("nova_theme");

    if (savedTheme === "light") {
        document.body.classList.add("light");
    }


    function toggleTheme() {

        document.body.classList.toggle("light");

        localStorage.setItem(
            "nova_theme",
            document.body.classList.contains("light")
                ? "light"
                : "dark"
        );
    }


    // ============================================================
    // SETTINGS
    // ============================================================

    function loadSettings() {

        settings =
            JSON.parse(
                localStorage.getItem("nova_settings") || "{}"
            );

        settings = {
            model:
                settings.model || "llama3.2:3b",

            temperature:
                typeof settings.temperature === "number"
                    ? settings.temperature
                    : 0.7,

            length:
                settings.length || "medium",

            personality:
                settings.personality ||
                "Be friendly, helpful, smart, direct, and easy to understand.",

            memory:
                settings.memory !== false,

            casual:
                settings.casual !== false
        };

        modelName.textContent =
            settings.model;
    }


    function openSettings() {
        window.location.href = "settings.html";
    }


    loadSettings();


    // ============================================================
    // CHAT LIST
    // ============================================================

    function renderChatList() {

        chatList.innerHTML = "";

        chats
            .slice()
            .reverse()
            .forEach((chat, reverseIndex) => {

                const index =
                    chats.length - 1 - reverseIndex;

                const item =
                    document.createElement("div");

                item.className = "chat-item";

                item.textContent =
                    chat.title || "New conversation";

                item.onclick = () => {
                    loadChat(index);
                };

                chatList.appendChild(item);
            });
    }


    function saveChats() {

        localStorage.setItem(
            "nova_chats",
            JSON.stringify(chats)
        );

        renderChatList();
    }


    // ============================================================
    // NEW CHAT
    // ============================================================

    function newChat() {

        messages = [];

        messagesElement.innerHTML = `
            <div class="welcome" id="welcome">
                <div class="welcome-inner">
                    <div class="welcome-icon">✦</div>
                    <h1>How can I help?</h1>
                    <p>
                        I'm Nova AI, your personal AI assistant.
                        Ask me anything, work on code, learn something,
                        or just start a conversation.
                    </p>
                </div>
            </div>
        `;

        input.value = "";
        input.focus();
    }


    // ============================================================
    // LOAD CHAT
    // ============================================================

    function loadChat(index) {

        const chat = chats[index];

        if (!chat) {
            return;
        }

        messages =
            chat.messages || [];

        messagesElement.innerHTML = "";

        messages.forEach(message => {

            addMessageToUI(
                message.role,
                message.content
            );

        });

        input.focus();
    }


    // ============================================================
    // ADD MESSAGE TO UI
    // ============================================================

    function addMessageToUI(
        role,
        content
    ) {

        if (welcomeElement) {
            welcomeElement.remove();
        }

        const message =
            document.createElement("div");

        message.className =
            `message ${role}`;

        const avatar =
            document.createElement("div");

        avatar.className = "avatar";

        avatar.textContent =
            role === "user"
                ? "You"
                : "✦";

        const body =
            document.createElement("div");

        body.className =
            "message-content";

        const roleText =
            document.createElement("div");

        roleText.className =
            "message-role";

        roleText.textContent =
            role === "user"
                ? "You"
                : "Nova AI";

        const text =
            document.createElement("div");

        text.textContent =
            content;

        body.appendChild(roleText);
        body.appendChild(text);

        message.appendChild(avatar);
        message.appendChild(body);

        messagesElement.appendChild(message);

        messagesElement.scrollTop =
            messagesElement.scrollHeight;

        return text;
    }


    // ============================================================
    // TYPING INDICATOR
    // ============================================================

    function addTypingIndicator() {

        const message =
            document.createElement("div");

        message.className =
            "message assistant";

        message.id =
            "typingMessage";

        message.innerHTML = `
            <div class="avatar">✦</div>

            <div class="message-content">

                <div class="message-role">
                    Nova AI
                </div>

                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>
        `;

        messagesElement.appendChild(message);

        messagesElement.scrollTop =
            messagesElement.scrollHeight;
    }


    function removeTypingIndicator() {

        const typing =
            document.getElementById(
                "typingMessage"
            );

        if (typing) {
            typing.remove();
        }
    }


    // ============================================================
    // SEND MESSAGE
    // ============================================================

    async function sendMessage() {

        const text =
            input.value.trim();

        if (!text) {
            return;
        }

        input.value = "";
        input.style.height = "auto";

        sendButton.disabled = true;

        addMessageToUI(
            "user",
            text
        );

        messages.push({
            role: "user",
            content: text
        });

        addTypingIndicator();

        try {

            /*
             * Memory ON:
             * Send the conversation history.
             *
             * Memory OFF:
             * Send only the latest user message.
             */

            let apiMessages;

            if (settings.memory) {

                apiMessages =
                    messages;

            } else {

                apiMessages = [
                    {
                        role: "user",
                        content: text
                    }
                ];
            }


            const response =
                await fetch(
                    CHAT_ENDPOINT,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            messages:
                                apiMessages,

                            settings: {
                                model:
                                    settings.model,

                                temperature:
                                    settings.temperature,

                                length:
                                    settings.length,

                                personality:
                                    settings.personality,

                                casual:
                                    settings.casual,

                                memory:
                                    settings.memory
                            }
                        })
                    }
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    `Server error ${response.status}: ${errorText}`
                );
            }


            const data =
                await response.json();

            const reply =
                data.reply ||
                "Nova did not return a response.";


            removeTypingIndicator();


            addMessageToUI(
                "assistant",
                reply
            );


            messages.push({
                role: "assistant",
                content: reply
            });


            saveCurrentChat();

        }
        catch (error) {

            console.error(
                "Nova error:",
                error
            );

            removeTypingIndicator();

            addMessageToUI(
                "assistant",
                "Sorry, I couldn't connect to Nova right now. Make sure the Nova server and ngrok tunnel are running."
            );
        }
        finally {

            sendButton.disabled = false;

            input.focus();
        }
    }


    // ============================================================
    // SAVE CURRENT CHAT
    // ============================================================

    function saveCurrentChat() {

        if (
            messages.length === 0
        ) {
            return;
        }

        const firstUserMessage =
            messages.find(
                message =>
                    message.role === "user"
            );

        const title =
            firstUserMessage
                ? firstUserMessage.content
                    .slice(0, 45)
                : "New conversation";


        const existing =
            chats.length > 0
                ? chats[chats.length - 1]
                : null;


        if (
            existing &&
            existing.messages &&
            existing.messages.length > 0
        ) {

            existing.messages =
                messages;

            existing.title =
                title;

        } else {

            chats.push({

                title,

                messages

            });
        }


        saveChats();
    }


    // ============================================================
    // CLEAR CHATS
    // ============================================================

    function clearChats() {

        if (!confirm(
            "Delete all saved conversations?"
        )) {
            return;
        }

        chats = [];

        localStorage.removeItem(
            "nova_chats"
        );

        renderChatList();

        newChat();
    }


    // ============================================================
    // TEXTAREA
    // ============================================================

    input.addEventListener(
        "input",
        () => {

            input.style.height =
                "auto";

            input.style.height =
                Math.min(
                    input.scrollHeight,
                    180
                ) + "px";
        }
    );


    input.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );


    // ============================================================
    // LOAD MODELS FROM NOVA BACKEND
    // ============================================================

    async function loadModels() {

        try {

            const response =
                await fetch(
                    MODELS_ENDPOINT
                );

            if (!response.ok) {
                return;
            }

            const data =
                await response.json();

            if (
                Array.isArray(data.models) &&
                data.models.length > 0
            ) {

                if (
                    !data.models.includes(
                        settings.model
                    )
                ) {

                    settings.model =
                        data.models[0];

                    localStorage.setItem(
                        "nova_settings",
                        JSON.stringify(settings)
                    );
                }

                modelName.textContent =
                    settings.model;
            }

        }
        catch (error) {

            console.warn(
                "Could not load models:",
                error
            );
        }
    }


    // ============================================================
    // START
    // ============================================================

    renderChatList();

    loadModels();

    input.focus();

</script>

</body>
</html>
