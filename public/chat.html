<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0d12;
            color: #f5f7fb;
            height: 100vh;
            overflow: hidden;
        }

        button,
        textarea {
            font-family: inherit;
        }


        /* =========================================
           APP
        ========================================= */

        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }


        /* =========================================
           SIDEBAR
        ========================================= */

        .sidebar {
            width: 250px;
            background: #10131a;
            border-right: 1px solid #242832;

            display: flex;
            flex-direction: column;

            padding: 18px;

            flex-shrink: 0;
        }


        /* LOGO */

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 21px;
            font-weight: bold;

            margin-bottom: 22px;
        }

        .logo-icon {
            width: 35px;
            height: 35px;

            border-radius: 11px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #7c5cff,
                #4f8cff
            );

            font-size: 17px;
        }


        /* NEW CHAT */

        .new-chat {
            width: 100%;

            border: 1px solid #343a48;
            background: #181c25;
            color: white;

            border-radius: 10px;

            padding: 11px 13px;

            cursor: pointer;

            font-size: 14px;
            font-weight: 600;

            transition: 0.2s;
        }

        .new-chat:hover {
            background: #222734;
            border-color: #4a5263;
        }


        /* RECENT */

        .recent-title {
            color: #858c9c;

            font-size: 11px;
            font-weight: bold;

            text-transform: uppercase;

            margin-top: 25px;
            margin-bottom: 9px;

            letter-spacing: 0.7px;
        }

        .recent {
            flex: 1;

            overflow-y: auto;

            padding-right: 3px;
        }

        .recent::-webkit-scrollbar {
            width: 5px;
        }

        .recent::-webkit-scrollbar-thumb {
            background: #303642;
            border-radius: 10px;
        }


        /* CHAT HISTORY ITEM */

        .history-item {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 5px;

            padding: 9px 10px;

            margin-bottom: 4px;

            border-radius: 8px;

            background: transparent;
            color: #c8ccd6;

            cursor: pointer;

            font-size: 13px;

            border: none;

            text-align: left;
        }

        .history-item:hover {
            background: #191d26;
        }

        .history-item.active {
            background: #202531;
            color: white;
        }

        .history-name {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;

            flex: 1;
        }

        .delete-chat {
            opacity: 0;

            border: none;
            background: transparent;

            color: #777f90;

            cursor: pointer;

            font-size: 14px;
        }

        .history-item:hover .delete-chat {
            opacity: 1;
        }

        .delete-chat:hover {
            color: #ff6b6b;
        }


        /* SIDEBAR BOTTOM */

        .sidebar-bottom {
            display: flex;
            gap: 6px;

            margin-top: 12px;
        }

        .side-button {
            flex: 1;

            font-size: 11px;

            padding: 8px 5px;

            border-radius: 8px;

            border: 1px solid #303541;

            background: #171a22;

            color: #aeb4c2;

            cursor: pointer;

            transition: 0.2s;
        }

        .side-button:hover {
            background: #222733;
            color: white;
        }


        /* =========================================
           MAIN
        ========================================= */

        .main {
            flex: 1;

            display: flex;
            flex-direction: column;

            min-width: 0;

            background: #0b0d12;
        }


        /* TOP BAR */

        .topbar {
            height: 62px;

            border-bottom: 1px solid #242832;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 22px;

            flex-shrink: 0;
        }

        .chat-title {
            font-size: 15px;
            font-weight: 600;
        }

        .model-status {
            display: flex;
            align-items: center;
            gap: 7px;

            color: #858c9c;

            font-size: 12px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            background: #55d68a;

            border-radius: 50%;
        }

        .home-link {
            color: #969dac;

            text-decoration: none;

            font-size: 13px;
        }

        .home-link:hover {
            color: white;
        }


        /* =========================================
           CHAT AREA
        ========================================= */

        .chat-area {
            flex: 1;

            overflow-y: auto;

            padding: 30px 20px 120px;
        }

        .chat-area::-webkit-scrollbar {
            width: 7px;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #303541;
            border-radius: 10px;
        }

        .messages {
            width: min(850px, 100%);
            margin: auto;
        }


        /* =========================================
           WELCOME
        ========================================= */

        .welcome {
            min-height: 55vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .welcome-icon {
            width: 60px;
            height: 60px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #7c5cff,
                #4f8cff
            );

            font-size: 27px;

            margin-bottom: 20px;

            box-shadow:
                0 10px 35px rgba(80, 100, 255, 0.25);
        }

        .welcome h1 {
            font-size: 30px;

            margin-bottom: 10px;
        }

        .welcome p {
            color: #858c9c;

            font-size: 14px;

            max-width: 520px;

            line-height: 1.6;
        }


        /* =========================================
           MESSAGE
        ========================================= */

        .message {
            display: flex;

            gap: 13px;

            margin-bottom: 27px;
        }

        .message-avatar {
            width: 34px;
            height: 34px;

            border-radius: 10px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 13px;
            font-weight: bold;
        }

        .message.user .message-avatar {
            background: #2a303c;
            color: #d8dce5;
        }

        .message.assistant .message-avatar {
            background: linear-gradient(
                135deg,
                #7c5cff,
                #4f8cff
            );

            color: white;
        }

        .message-content {
            flex: 1;

            min-width: 0;
        }

        .message-role {
            font-size: 12px;

            color: #7e8595;

            margin-bottom: 6px;

            font-weight: 600;
        }

        .message-text {
            font-size: 14px;

            line-height: 1.7;

            color: #e6e9ef;

            white-space: pre-wrap;

            word-wrap: break-word;
        }


        /* =========================================
           CODE
        ========================================= */

        .message-text code {
            background: #181c24;

            border: 1px solid #292e39;

            border-radius: 5px;

            padding: 2px 5px;

            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;

            font-size: 12px;
        }


        /* =========================================
           TYPING
        ========================================= */

        .typing {
            display: flex;

            align-items: center;

            gap: 5px;

            padding-top: 4px;
        }

        .typing span {
            width: 6px;
            height: 6px;

            background: #737b8c;

            border-radius: 50%;

            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }

        }


        /* =========================================
           INPUT
        ========================================= */

        .input-wrapper {
            position: fixed;

            bottom: 0;
            left: 250px;
            right: 0;

            padding: 15px 20px 18px;

            background:
                linear-gradient(
                    transparent,
                    #0b0d12 35%
                );
        }

        .input-container {
            width: min(850px, 100%);

            margin: auto;

            display: flex;

            align-items: flex-end;

            gap: 9px;

            background: #151820;

            border: 1px solid #303541;

            border-radius: 14px;

            padding: 9px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.3);
        }

        #messageInput {
            flex: 1;

            min-height: 42px;
            max-height: 150px;

            resize: none;

            border: none;
            outline: none;

            background: transparent;

            color: white;

            font-size: 14px;

            line-height: 1.5;

            padding: 10px 8px;
        }

        #messageInput::placeholder {
            color: #687080;
        }

        #sendButton {
            width: 42px;
            height: 42px;

            border-radius: 10px;

            border: none;

            background: linear-gradient(
                135deg,
                #7c5cff,
                #4f8cff
            );

            color: white;

            cursor: pointer;

            font-size: 17px;

            flex-shrink: 0;

            transition: 0.2s;
        }

        #sendButton:hover {
            transform: translateY(-1px);

            filter: brightness(1.1);
        }

        #sendButton:disabled {
            opacity: 0.45;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================================
           EMPTY HISTORY
        ========================================= */

        .empty-history {
            color: #626978;

            font-size: 12px;

            text-align: center;

            padding: 15px 5px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .sidebar {
                width: 70px;

                padding: 12px 9px;
            }

            .logo {
                justify-content: center;
            }

            .logo-text,
            .recent-title,
            .history-name {
                display: none;
            }

            .new-chat {
                font-size: 0;

                padding: 11px 5px;
            }

            .new-chat::after {
                content: "+";

                font-size: 20px;
            }

            .history-item {
                justify-content: center;

                padding: 10px 5px;
            }

            .delete-chat {
                display: none;
            }

            .sidebar-bottom {
                flex-direction: column;
            }

            .side-button {
                font-size: 10px;
            }

            .input-wrapper {
                left: 70px;

                padding-left: 10px;
                padding-right: 10px;
            }

            .topbar {
                padding: 0 14px;
            }

            .model-status {
                display: none;
            }

        }

    </style>
</head>


<body>

<div class="app">


    <!-- =====================================
         SIDEBAR
    ====================================== -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                ✦
            </div>

            <span class="logo-text">
                Nova AI
            </span>

        </div>


        <button
            class="new-chat"
            id="newChatButton"
        >
            + New conversation
        </button>


        <div class="recent-title">
            Recent chats
        </div>


        <div
            class="recent"
            id="recentChats"
        ></div>


        <div class="sidebar-bottom">

            <button
                class="side-button"
                id="clearButton"
            >
                Clear
            </button>

            <button
                class="side-button"
                id="themeButton"
            >
                Theme
            </button>

            <button
                class="side-button"
                id="settingsButton"
            >
                Settings
            </button>

        </div>

    </aside>



    <!-- =====================================
         MAIN
    ====================================== -->

    <main class="main">


        <!-- TOPBAR -->

        <header class="topbar">

            <div>

                <div class="chat-title">
                    New conversation
                </div>

                <div class="model-status">

                    <span class="status-dot"></span>

                    <span id="modelName">
                        llama3.2:3b
                    </span>

                </div>

            </div>


            <a
                class="home-link"
                href="index.html"
            >
                Home
            </a>

        </header>



        <!-- =================================
             CHAT AREA
        ================================== -->

        <section
            class="chat-area"
            id="chatArea"
        >

            <div
                class="messages"
                id="messages"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-icon">
                        ✦
                    </div>

                    <h1>
                        What can I help with?
                    </h1>

                    <p>
                        I'm Nova, your personal AI assistant.
                        Ask me anything, work on code,
                        learn something new, or just chat.
                    </p>

                </div>

            </div>

        </section>



        <!-- =================================
             INPUT
        ================================== -->

        <div class="input-wrapper">

            <div class="input-container">

                <textarea
                    id="messageInput"
                    placeholder="Message Nova..."
                    rows="1"
                    autocomplete="off"
                ></textarea>


                <button
                    id="sendButton"
                    title="Send message"
                >
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>



<script>

    /* =========================================
       STORAGE
    ========================================= */

    const CHAT_STORAGE =
        "nova_chats";

    const SETTINGS_STORAGE =
        "nova_settings";


    /* =========================================
       ELEMENTS
    ========================================= */

    const messagesContainer =
        document.getElementById(
            "messages"
        );

    const welcome =
        document.getElementById(
            "welcome"
        );

    const input =
        document.getElementById(
            "messageInput"
        );

    const sendButton =
        document.getElementById(
            "sendButton"
        );

    const recentChats =
        document.getElementById(
            "recentChats"
        );

    const newChatButton =
        document.getElementById(
            "newChatButton"
        );

    const clearButton =
        document.getElementById(
            "clearButton"
        );

    const themeButton =
        document.getElementById(
            "themeButton"
        );

    const settingsButton =
        document.getElementById(
            "settingsButton"
        );

    const chatArea =
        document.getElementById(
            "chatArea"
        );

    const modelName =
        document.getElementById(
            "modelName"
        );


    /* =========================================
       DEFAULT SETTINGS
    ========================================= */

    const defaultSettings = {

        model:
            "llama3.2:3b",

        temperature:
            0.7,

        length:
            "medium",

        personality:
            "Be friendly, helpful, smart, direct, and easy to understand.",

        memory:
            true,

        casual:
            true

    };


    /* =========================================
       SETTINGS
    ========================================= */

    function getSettings() {

        try {

            const saved =
                JSON.parse(
                    localStorage.getItem(
                        SETTINGS_STORAGE
                    ) || "{}"
                );

            return {
                ...defaultSettings,
                ...saved
            };

        }

        catch {

            return {
                ...defaultSettings
            };

        }

    }


    function updateModelDisplay() {

        const settings =
            getSettings();

        modelName.textContent =
            settings.model;

    }


    /* =========================================
       CHAT DATA
    ========================================= */

    let chats = [];

    let currentChatId = null;


    function loadChats() {

        try {

            chats =
                JSON.parse(
                    localStorage.getItem(
                        CHAT_STORAGE
                    ) || "[]"
                );

        }

        catch {

            chats = [];

        }

    }


    function saveChats() {

        localStorage.setItem(
            CHAT_STORAGE,
            JSON.stringify(chats)
        );

    }


    function createChat() {

        const chat = {

            id:
                Date.now().toString(),

            title:
                "New conversation",

            messages:
                [],

            created:
                Date.now()

        };


        chats.unshift(chat);

        currentChatId =
            chat.id;

        saveChats();

        renderSidebar();

        renderChat();

    }


    function getCurrentChat() {

        return chats.find(
            chat =>
                chat.id === currentChatId
        );

    }


    /* =========================================
       SIDEBAR
    ========================================= */

    function renderSidebar() {

        recentChats.innerHTML = "";


        if (chats.length === 0) {

            recentChats.innerHTML = `
                <div class="empty-history">
                    No conversations yet.
                </div>
            `;

            return;

        }


        chats.forEach(chat => {

            const item =
                document.createElement(
                    "button"
                );

            item.className =
                "history-item";


            if (
                chat.id === currentChatId
            ) {

                item.classList.add(
                    "active"
                );

            }


            const name =
                document.createElement(
                    "span"
                );

            name.className =
                "history-name";

            name.textContent =
                chat.title;


            const deleteButton =
                document.createElement(
                    "span"
                );

            deleteButton.className =
                "delete-chat";

            deleteButton.textContent =
                "×";

            deleteButton.title =
                "Delete conversation";


            deleteButton.onclick =
                function(event) {

                    event.stopPropagation();

                    deleteChat(
                        chat.id
                    );

                };


            item.appendChild(name);

            item.appendChild(
                deleteButton
            );


            item.onclick =
                function() {

                    currentChatId =
                        chat.id;

                    renderSidebar();

                    renderChat();

                };


            recentChats.appendChild(
                item
            );

        });

    }


    /* =========================================
       DELETE CHAT
    ========================================= */

    function deleteChat(id) {

        chats =
            chats.filter(
                chat =>
                    chat.id !== id
            );


        if (
            currentChatId === id
        ) {

            currentChatId =
                chats.length
                    ? chats[0].id
                    : null;

        }


        saveChats();

        renderSidebar();

        renderChat();

    }


    /* =========================================
       RENDER CHAT
    ========================================= */

    function renderChat() {

        messagesContainer.innerHTML = "";


        const chat =
            getCurrentChat();


        if (
            !chat ||
            chat.messages.length === 0
        ) {

            messagesContainer.appendChild(
                createWelcome()
            );

            return;

        }


        chat.messages.forEach(
            message => {

                addMessageToUI(
                    message.role,
                    message.content
                );

            }
        );


        scrollToBottom();

    }


    function createWelcome() {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "welcome";


        div.innerHTML = `

            <div class="welcome-icon">
                ✦
            </div>

            <h1>
                What can I help with?
            </h1>

            <p>
                I'm Nova, your personal AI assistant.
                Ask me anything, work on code,
                learn something new, or just chat.
            </p>

        `;


        return div;

    }


    /* =========================================
       ADD MESSAGE
    ========================================= */

    function addMessageToUI(
        role,
        content
    ) {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            `message ${role}`;


        const avatar =
            document.createElement(
                "div"
            );

        avatar.className =
            "message-avatar";

        avatar.textContent =
            role === "user"
                ? "You"
                : "✦";


        const contentWrapper =
            document.createElement(
                "div"
            );

        contentWrapper.className =
            "message-content";


        const roleName =
            document.createElement(
                "div"
            );

        roleName.className =
            "message-role";

        roleName.textContent =
            role === "user"
                ? "You"
                : "Nova";


        const text =
            document.createElement(
                "div"
            );

        text.className =
            "message-text";

        text.textContent =
            content;


        contentWrapper.appendChild(
            roleName
        );

        contentWrapper.appendChild(
            text
        );


        message.appendChild(
            avatar
        );

        message.appendChild(
            contentWrapper
        );


        messagesContainer.appendChild(
            message
        );

    }


    /* =========================================
       TYPING INDICATOR
    ========================================= */

    function showTyping() {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "message assistant";

        message.id =
            "typingMessage";


        message.innerHTML = `

            <div class="message-avatar">
                ✦
            </div>

            <div class="message-content">

                <div class="message-role">
                    Nova
                </div>

                <div class="typing">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        `;


        messagesContainer.appendChild(
            message
        );

        scrollToBottom();

    }


    function removeTyping() {

        const typing =
            document.getElementById(
                "typingMessage"
            );

        if (typing) {

            typing.remove();

        }

    }


    /* =========================================
       SEND MESSAGE
    ========================================= */

    async function sendMessage() {

        const text =
            input.value.trim();


        if (!text) {

            return;

        }


        let chat =
            getCurrentChat();


        if (!chat) {

            createChat();

            chat =
                getCurrentChat();

        }


        // Remove welcome screen
        const currentWelcome =
            document.querySelector(
                ".welcome"
            );

        if (currentWelcome) {

            currentWelcome.remove();

        }


        // Add user message
        chat.messages.push({

            role:
                "user",

            content:
                text

        });


        // Automatically name conversation
        if (
            chat.title ===
            "New conversation"
        ) {

            chat.title =
                text.length > 32
                    ? text.substring(
                        0,
                        32
                    ) + "..."
                    : text;

        }


        addMessageToUI(
            "user",
            text
        );


        input.value = "";

        autoResize();

        saveChats();

        renderSidebar();

        scrollToBottom();


        // Disable input while thinking
        sendButton.disabled =
            true;

        input.disabled =
            true;


        showTyping();


        try {

            const settings =
                getSettings();


            /*
             * MEMORY SETTING
             *
             * If memory is enabled,
             * send the full conversation.
             *
             * If disabled,
             * send only the newest message.
             */

            let messagesToSend;


            if (
                settings.memory !== false
            ) {

                messagesToSend =
                    chat.messages;

            }

            else {

                messagesToSend = [

                    {
                        role:
                            "user",

                        content:
                            text
                    }

                ];

            }


            const response =
                await fetch(
                    "[https://labored-overlap-reappoint.ngrok-free.dev/api/chat](https://labored-overlap-reappoint.ngrok-free.dev/api/chat)",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                messages:
                                    messagesToSend,

                                settings:
                                    settings

                            })

                    }
                );


            const data =
                await response.json();


            removeTyping();


            if (
                !response.ok
            ) {

                throw new Error(
                    data.error ||
                    "Nova could not respond."
                );

            }


            const reply =
                data.reply ||
                "Nova did not return a response.";


            chat.messages.push({

                role:
                    "assistant",

                content:
                    reply

            });


            saveChats();


            // Type response
            await typeAssistantMessage(
                reply
            );


            scrollToBottom();

        }

        catch (error) {

            removeTyping();


            const errorMessage =
                "Sorry, I couldn't connect to Nova right now.\n\n" +
                error.message;


            chat.messages.push({

                role:
                    "assistant",

                content:
                    errorMessage

            });


            saveChats();


            addMessageToUI(
                "assistant",
                errorMessage
            );

        }

        finally {

            sendButton.disabled =
                false;

            input.disabled =
                false;

            input.focus();

            scrollToBottom();

        }

    }


    /* =========================================
       TYPE ASSISTANT MESSAGE
    ========================================= */

    async function typeAssistantMessage(
        content
    ) {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "message assistant";


        const avatar =
            document.createElement(
                "div"
            );

        avatar.className =
            "message-avatar";

        avatar.textContent =
            "✦";


        const wrapper =
            document.createElement(
                "div"
            );

        wrapper.className =
            "message-content";


        const role =
            document.createElement(
                "div"
            );

        role.className =
            "message-role";

        role.textContent =
            "Nova";


        const text =
            document.createElement(
                "div"
            );

        text.className =
            "message-text";


        wrapper.appendChild(
            role
        );

        wrapper.appendChild(
            text
        );


        message.appendChild(
            avatar
        );

        message.appendChild(
            wrapper
        );


        messagesContainer.appendChild(
            message
        );


        /*
         * Fast typing effect.
         * The actual response is already
         * saved in chat history.
         */

        const words =
            content.split(" ");

        let output = "";


        for (
            let i = 0;
            i < words.length;
            i++
        ) {

            output +=
                (i === 0 ? "" : " ") +
                words[i];

            text.textContent =
                output;

            scrollToBottom();


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        8
                    )
            );

        }

    }


    /* =========================================
       SCROLL
    ========================================= */

    function scrollToBottom() {

        setTimeout(
            () => {

                chatArea.scrollTop =
                    chatArea.scrollHeight;

            },
            10
        );

    }


    /* =========================================
       NEW CHAT
    ========================================= */

    newChatButton.onclick =
        function() {

            createChat();

            input.focus();

        };


    /* =========================================
       CLEAR ALL
    ========================================= */

    clearButton.onclick =
        function() {

            if (
                chats.length === 0
            ) {

                return;

            }


            const confirmed =
                confirm(
                    "Delete all Nova conversations?"
                );


            if (!confirmed) {

                return;

            }


            chats = [];

            currentChatId =
                null;

            saveChats();

            renderSidebar();

            renderChat();

        };


    /* =========================================
       SETTINGS
    ========================================= */

    settingsButton.onclick =
        function() {

            window.location.href =
                "settings.html";

        };


    /* =========================================
       THEME
    ========================================= */

    let lightMode =
        localStorage.getItem(
            "nova_theme"
        ) === "light";


    function applyTheme() {

        if (lightMode) {

            document.body.style.background =
                "#f4f6fa";

            document.body.style.color =
                "#111";

            document.querySelector(
                ".main"
            ).style.background =
                "#f4f6fa";

            document.querySelector(
                ".sidebar"
            ).style.background =
                "#ffffff";

        }

        else {

            document.body.style.background =
                "#0b0d12";

            document.body.style.color =
                "#f5f7fb";

            document.querySelector(
                ".main"
            ).style.background =
                "#0b0d12";

            document.querySelector(
                ".sidebar"
            ).style.background =
                "#10131a";

        }

    }


    themeButton.onclick =
        function() {

            lightMode =
                !lightMode;

            localStorage.setItem(
                "nova_theme",
                lightMode
                    ? "light"
                    : "dark"
            );

            applyTheme();

        };


    /* =========================================
       TEXTAREA AUTO RESIZE
    ========================================= */

    function autoResize() {

        input.style.height =
            "auto";


        input.style.height =
            Math.min(
                input.scrollHeight,
                150
            ) + "px";

    }


    input.addEventListener(
        "input",
        autoResize
    );


    /* =========================================
       ENTER TO SEND
    ========================================= */

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* =========================================
       SEND BUTTON
    ========================================= */

    sendButton.onclick =
        sendMessage;


    /* =========================================
       INITIALIZE
    ========================================= */

    loadChats();


    if (chats.length === 0) {

        createChat();

    }

    else {

        currentChatId =
            chats[0].id;

    }


    renderSidebar();

    renderChat();

    updateModelDisplay();

    applyTheme();

    input.focus();

</script>

</body>
</html>
